<title>Kieran's Birthday Trip</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a full-bleed dusk map, letterboxed like a film still, with one paper card that pages through the itinerary. */
:root{
  --sea:#14263a; --sky:#2a3b52; --paper:#f1e6cf; --ink:#1d1a16; --red:#c2412f; --mustard:#e0a82e; --muted:#6d6252; --haze:#e9d9b8;
  --display:"Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--sea);color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky) 0%,var(--sea) 55%)}
#stage canvas{display:block;width:100%;height:100%}
/* film treatment */
.grade{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(5,10,18,.55) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}
.bar{position:fixed;left:0;right:0;height:max(18px,3.2vh);background:#05080d;pointer-events:none;z-index:3}
.bar.top{top:0;height:calc(max(18px,3.2vh) + env(safe-area-inset-top,0px))}
.bar.bottom{bottom:0;height:calc(max(18px,3.2vh) + env(safe-area-inset-bottom,0px))}
/* header */
.head{position:fixed;z-index:4;left:0;right:0;top:calc(max(18px,3.2vh) + env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.head .kick{white-space:nowrap;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--paper);background:rgba(20,38,58,.82);padding:4px 8px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;background:rgba(20,38,58,.82);padding:6px 8px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(241,230,207,.28)}
.dots i.on{background:var(--mustard)}
/* labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;transform:translate(-50%,-135%);white-space:nowrap;font-family:var(--body);font-size:12px;
  color:var(--ink);background:var(--paper);padding:3px 8px;border:1px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.lbl.city{background:transparent;border:0;box-shadow:none;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;transform:translate(-50%,-50%);text-shadow:0 0 3px var(--paper),0 0 6px var(--paper)}
.lbl.on{background:var(--red);color:var(--paper);border-color:var(--red)}
/* card */
.card{position:fixed;z-index:4;left:0;right:0;bottom:calc(max(18px,3.2vh) + env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:440px;margin:0 auto;background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px}
.sheet .when{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.sheet h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,7vw,32px);line-height:1.04;margin:0;text-wrap:balance}
.sheet p{margin:0;font-size:15.5px;line-height:1.48}
.sheet blockquote{margin:2px 0 0;padding-left:10px;border-left:3px solid var(--mustard);font-style:italic;font-size:15px}
.sheet blockquote small{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:8px;margin-top:8px}
.nav button{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:11px 14px;
  border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.nav button.next{flex:1;background:var(--ink);color:var(--paper)}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.sheet.swap{animation:swap .45s ease}
@keyframes swap{from{transform:translateY(10px)}to{transform:none}}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--haze)}
@media (prefers-reduced-motion:reduce){.grain{animation:none}.sheet.swap{animation:none}}
</style>
</head>

    cam:{lat:41.425,lon:2.115,dist:44,pitch:54,head:28}, show:["loft","rubi"], focus:"rubi", route:["loft","rubi"] },
  { when:"Tue 10 Nov", title:"Barcelona to Málaga",
    body:"Flight. Time to confirm.",
    cam:{lat:38.6,lon:-1.0,dist:1200,pitch:55,head:24}, show:["bcn","agp"], flight:["bcn","agp"] },
  { when:"Tue 10 – Sat 14 Nov", title:"Apartment in Pedregalejo",
    body:"Airbnb by the beach in east Málaga, near David Núñez.",
    cam:{lat:36.722,lon:-4.39,dist:13,pitch:54,head:-10}, show:["pedre"], focus:"pedre" },
  { when:"Málaga", title:"Harmony Sanctuary",
    body:"Couples massage. Calle Especería 5, old town.",
    cam:{lat:36.7265,lon:-4.398,dist:19,pitch:50,head:0}, show:["pedre","massage"], focus:"massage", route:["pedre","massage"] },
  { when:"Málaga", title:"Espetos",
    body:"Grilled sardines at the beach chiringuitos in Pedregalejo and El Palo.",
    cam:{lat:36.7235,lon:-4.371,dist:4,pitch:60,head:4}, show:["pedre","fish"], focus:"fish" },
  { when:"Málaga", title:"Time with David",
    body:"Hacking with David Núñez (NuCypher, TACO). First stop of forward deployed engineering with friends.",
    cam:{lat:36.724,lon:-4.376,dist:6,pitch:58,head:30}, show:["pedre"], focus:"pedre" },
  { when:"From 14 Nov", title:"Open",
    body:"Next stops to be decided.",
    cam:{lat:41.2,lon:-1.6,dist:2900,pitch:54,head:0}, show:[], future:["far1","far2","far3","far4"] }
];

// ---------- projection: km on a local plane ----------
const LAT0 = 44, LON0 = 1, KX = 111.32*Math.cos(LAT0*Math.PI/180), KY = 110.57;
const px = lon => (lon-LON0)*KX, pz = lat => -(lat-LAT0)*KY;
const v3 = (p,y=0) => new THREE.Vector3(px(p.lon), y, pz(p.lat));
const LAND_H = 0.15, CITY_H = 0.06;

// ---------- three ----------
if(!window.THREE){ document.getElementById("stage").innerHTML = '<div class="fallback">The map needs a newer browser. The trip is in the card below.</div>'; }
const stage = document.getElementById("stage");
const renderer = window.THREE && new THREE.WebGLRenderer({antialias:true, alpha:true});
let scene, camera;
const C = {sea:0x14263a, land:0xeee2c6, edge:0xa48f68, border:0x9c8a66, pin:0xc2412f, pinDim:0x8d3a2c, stem:0x1d1a16, gold:0xe0a82e, route:0xc2412f, trail:0xe0a82e, haze:0x2a3b52};

if(renderer){
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  stage.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(C.haze, 10, 100);
  camera = new THREE.PerspectiveCamera(42, 1, 0.1, 10000);
  scene.add(new THREE.HemisphereLight(0xfff6e6, 0x2a3446, 0.6));
  const sun = new THREE.DirectionalLight(0xfff0d8, 0.5); sun.position.set(-0.6, 1, 0.4); scene.add(sun);

  // sea
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshBasicMaterial({color:C.sea}));
  sea.rotation.x = -Math.PI/2; sea.position.set(0,-0.01,0); scene.add(sea);

  // land: one extruded mesh, plus thin borders on top
  const shapes = [], borderPts = [];
  GEO.forEach(poly => {
    const toV = r => r.map(([lon,lat]) => new THREE.Vector2(px(lon), -pz(lat)));
    const outer = toV(poly.r[0]); if(outer.length<3) return;
    const sh = new THREE.Shape(outer);
    poly.r.slice(1).forEach(h => sh.holes.push(new THREE.Path(toV(h))));
    shapes.push(sh);
    poly.r.forEach(r => { for(let i=0;i<r.length-1;i++){ borderPts.push(px(r[i][0]),LAND_H+0.02,pz(r[i][1]), px(r[i+1][0]),LAND_H+0.02,pz(r[i+1][1])) } });
  });
  const landGeo = new THREE.ExtrudeGeometry(shapes, {depth:LAND_H, bevelEnabled:false, curveSegments:1});
  const land = new THREE.Mesh(landGeo, [new THREE.MeshLambertMaterial({color:C.land}), new THREE.MeshLambertMaterial({color:C.edge})]);
  land.rotation.x = -Math.PI/2; scene.add(land);
  const bg = new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.Float32BufferAttribute(borderPts,3));
  scene.add(new THREE.LineSegments(bg, new THREE.LineBasicMaterial({color:C.border, transparent:true, opacity:.55})));

  // cities as low raised blocks, so Barcelona and Málaga read up close
  const toV2 = r => r.map(([lon,lat]) => new THREE.Vector2(px(lon), -pz(lat)));
  const urbanShapes = URBAN.map(poly => { const sh = new THREE.Shape(toV2(poly[0])); poly.slice(1).forEach(h => sh.holes.push(new THREE.Path(toV2(h)))); return sh; });
  const urban = new THREE.Mesh(new THREE.ExtrudeGeometry(urbanShapes, {depth:CITY_H, bevelEnabled:false, curveSegments:1}),
    [new THREE.MeshLambertMaterial({color:0xd8c29a}), new THREE.MeshLambertMaterial({color:0x8f7a55})]);
  urban.rotation.x = -Math.PI/2; urban.position.y = LAND_H; scene.add(urban);
}

// ---------- pins, routes, plane ----------
const pins = {};
const scaled = []; // objects sized to the camera distance
function makePin(id){
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,8), new THREE.MeshLambertMaterial({color:C.stem}));
  stem.position.y = 0.5; g.add(stem);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16,20,14), new THREE.MeshLambertMaterial({color:C.pin}));
  head.position.y = 1.05; g.add(head);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.22,0.3,40), new THREE.MeshBasicMaterial({color:C.gold, transparent:true, opacity:.9, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; g.add(ring);
  g.position.copy(v3(P[id], LAND_H+CITY_H)); g.userData = {ring, head}; g.visible = false;
  scene.add(g); pins[id] = g; scaled.push(g);
}
function arcCurve(a, b, lift){
  const A = v3(P[a], LAND_H+CITY_H+0.03), B = v3(P[b], LAND_H+CITY_H+0.03);
  const M = A.clone().lerp(B, .5); M.y += lift;
  return new THREE.QuadraticBezierCurve3(A, M, B);
}
const routes = {}; // key "a-b"
function makeRoute(a, b, flight, future){
  const d = v3(P[a]).distanceTo(v3(P[b]));
  const curve = arcCurve(a, b, flight ? d*0.22 : d*0.08);
  const r = flight ? d*0.0028 : d*0.012;
  const geo = new THREE.TubeGeometry(curve, flight?160:60, r, 8, false);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: future?C.trail:flight?C.gold:C.route, transparent:true, opacity: future?.7:.95}));
  mesh.visible = false; geo.setDrawRange(0, 0);
  scene.add(mesh); routes[a+"-"+b] = {mesh, geo, curve, total: geo.index ? geo.index.count : geo.attributes.position.count, flight};
}
let plane;
function makePlane(){
  plane = new THREE.Group();
  const m = new THREE.MeshLambertMaterial({color:0xf6eedd});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.04,1,10), m); body.rotation.x = Math.PI/2; plane.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.02,0.18), m); wing.position.z = -0.05; plane.add(wing);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.02,0.1), m); tail.position.z = 0.42; plane.add(tail);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.02,0.18,0.12), new THREE.MeshLambertMaterial({color:C.pin})); fin.position.set(0,0.09,0.42); plane.add(fin);
  plane.visible = false; scene.add(plane); scaled.push(plane);
}
if(renderer){
  Object.keys(P).filter(id=>!P[id].anon).forEach(makePin);
  [["ams","bcn",1],["bcn","agp",1],["loft","sedeta"],["loft","mollet"],["loft","rubi"],["pedre","massage"]].forEach(([a,b,f])=>makeRoute(a,b,!!f));
  ["far1","far2","far3","far4"].forEach(f=>makeRoute("agp",f,true,true));
  makePlane();
}

// ---------- labels ----------
const labelsEl = document.getElementById("labels");
const labelEls = {};
Object.keys(P).filter(id=>!P[id].anon).forEach(id => { const d=document.createElement("div"); d.className="lbl"; d.textContent=P[id].name; d.style.opacity=0; labelsEl.appendChild(d); labelEls[id]=d; });
const cityEls = CITIES.map(c => { const d=document.createElement("div"); d.className="lbl city"; d.textContent=c.name; labelsEl.appendChild(d); return d; });

// ---------- camera ----------
const cam = {x:0,z:0,dist:2700,pitch:32,head:0};
function camFrom(c){ return {x:px(c.lon), z:pz(c.lat), dist:c.dist, pitch:c.pitch, head:c.head}; }
function applyCam(){
  if(!renderer) return;
  const p = cam.pitch*Math.PI/180, h = cam.head*Math.PI/180;
  camera.position.set(cam.x + cam.dist*Math.sin(p)*Math.sin(h), cam.dist*Math.cos(p), cam.z + cam.dist*Math.sin(p)*Math.cos(h));
  camera.lookAt(cam.x, 0, cam.z);
  // close-ups lift the stops above the card; the wide horizon shots drop the horizon to show the night sky
  const lift = 0.16 * Math.max(0, Math.min(1, (76 - cam.pitch)/10)) - 0.1 * Math.max(0, Math.min(1, (cam.pitch-70)/8));
  camera.setViewOffset(innerWidth, innerHeight, 0, Math.round(innerHeight*lift), innerWidth, innerHeight);
  camera.near = Math.max(0.05, cam.dist/200); camera.far = cam.dist*12; camera.updateProjectionMatrix();
  scene.fog.near = cam.dist*1.1; scene.fog.far = cam.dist*4.2;
  const s = cam.dist/26;
  scaled.forEach(o => o.scale.setScalar(s));
}
let tween = null;
function flyTo(c, ms){
  const from = {...cam}, to = camFrom(c);
  const travel = Math.hypot(to.x-from.x, to.z-from.z);
  const bump = Math.min(2.5, travel / Math.max(from.dist, to.dist) * 0.6);
  tween = {from, to, bump, t0: performance.now(), ms: reduce ? 1 : ms};
}
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function stepTween(now){
  if(!tween) return false;
  const k = Math.min(1, (now - tween.t0)/tween.ms), e = ease(k), f = tween.from, t = tween.to;
  cam.x = f.x + (t.x-f.x)*e; cam.z = f.z + (t.z-f.z)*e;
  cam.dist = Math.exp(Math.log(f.dist) + (Math.log(t.dist)-Math.log(f.dist))*e) * (1 + tween.bump*Math.sin(Math.PI*e));
  cam.pitch = f.pitch + (t.pitch-f.pitch)*e;
  let dh = ((t.head-f.head+540)%360)-180; cam.head = f.head + dh*e;
  if(k>=1) tween = null;
  return true;
}

// ---------- chapter state ----------
let idx = 0, routeAnim = [], flightAnim = null;
const $ = id => document.getElementById(id);
const dots = $("dots"); CH.forEach(()=>dots.appendChild(document.createElement("i")));
function show(i, first){
  idx = Math.max(0, Math.min(CH.length-1, i));
  const c = CH[idx];
  $("when").textContent = c.when; $("title").textContent = c.title; $("body").textContent = c.body;
  const q = $("quote"); if(c.quote){ q.innerHTML = c.quote; q.hidden = false } else { q.hidden = true }
  $("prev").disabled = idx===0; $("next").textContent = idx===CH.length-1 ? "From the top" : "Next";
  [...dots.children].forEach((d,j)=>d.classList.toggle("on", j<=idx));
  const sh = $("sheet"); sh.classList.remove("swap"); void sh.offsetWidth; sh.classList.add("swap");
  try{ localStorage.setItem("trip-ch", String(idx)) }catch(e){}
  if(!renderer) return;

  const visible = new Set(c.show);
  Object.entries(pins).forEach(([id,g]) => { g.visible = visible.has(id); g.userData.head.material.color.setHex(id===c.focus ? C.pin : C.pinDim) });
  Object.keys(labelEls).forEach(id => labelEls[id].classList.toggle("on", id===c.focus));
  Object.values(routes).forEach(r => { r.mesh.visible = false; r.geo.setDrawRange(0,0) });
  routeAnim = []; flightAnim = null; plane.visible = false;
  const now = performance.now();
  if(c.future){
    ["ams-bcn","bcn-agp"].forEach(k => { const r = routes[k]; r.mesh.visible = true; routeAnim.push({r, t0: now, ms: 1}) });
    c.future.forEach((f,i) => { const r = routes["agp-"+f]; r.mesh.visible = true; routeAnim.push({r, t0: now+(first?0:1800)+i*450, ms: reduce?1:3200}) });
    const r = routes["agp-far1"]; flightAnim = {r, t0: now+(first?0:1800), ms: reduce?1:5200}; plane.visible = true;
  }
  if(c.route){ const r = routes[c.route.join("-")]; r.mesh.visible = true; routeAnim.push({r, t0: now+(first?0:1400), ms: reduce?1:1600}); }
  if(c.flight){ const r = routes[c.flight.join("-")]; r.mesh.visible = true; flightAnim = {r, t0: now+(first?200:1600), ms: reduce?1:4200}; routeAnim.push({r, t0: flightAnim.t0, ms: flightAnim.ms}); plane.visible = true; }
  if(first){ Object.assign(cam, camFrom(c.cam)) } else { flyTo(c.cam, 2600) }
}
$("next").onclick = () => show(idx===CH.length-1 ? 0 : idx+1);
$("prev").onclick = () => show(idx-1);
addEventListener("keydown", e => { if(e.key==="ArrowRight") show(idx+1); if(e.key==="ArrowLeft") show(idx-1); });
let sx=null; const card=$("sheet");
card.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX }, {passive:true});
card.addEventListener("touchend", e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) show(idx+(dx<0?1:-1)); sx=null });

// ---------- render loop ----------
function resize(){ if(!renderer) return; const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.setViewOffset(w, h, 0, Math.round(h*0.16), w, h); camera.updateProjectionMatrix(); }
addEventListener("resize", resize);
function project(lat, lon, y){
  const v = new THREE.Vector3(px(lon), y, pz(lat)).project(camera);
  return {x:(v.x+1)/2*innerWidth, y:(1-v.y)/2*innerHeight, ok: v.z<1 && v.z>-1};
}
function frame(now){
  stepTween(now); applyCam();
  routeAnim.forEach(a => { const k = Math.max(0, Math.min(1, (now-a.t0)/a.ms)); a.r.geo.setDrawRange(0, Math.floor(a.r.total*ease(k)/3)*3) });
  if(flightAnim){
    const k = Math.max(0, Math.min(1, (now-flightAnim.t0)/flightAnim.ms)), e = ease(k);
    const p = flightAnim.r.curve.getPointAt(e), q = flightAnim.r.curve.getPointAt(Math.min(1,e+0.01));
    plane.position.copy(p); plane.lookAt(q); plane.rotateY(Math.PI);
  }
  const t = now/1000;
  Object.entries(pins).forEach(([id,g]) => { if(!g.visible) return; const on = id===CH[idx].focus; const s = on ? 1+0.35*Math.sin(t*3) : 1; g.userData.ring.scale.setScalar(s); g.userData.ring.material.opacity = on ? .9 : .35 });
  // labels
  const c = CH[idx];
  Object.keys(labelEls).forEach(id => {
    const el = labelEls[id], vis = pins[id].visible;
    if(!vis){ el.style.opacity = 0; return }
    const s = pins[id].scale.x, pr = project(P[id].lat, P[id].lon, LAND_H + 1.3*s);
    el.style.left = pr.x+"px"; el.style.top = pr.y+"px"; el.style.opacity = pr.ok ? 1 : 0;
  });
  const wide = cam.dist > 300;
  CITIES.forEach((cty,i) => { const el = cityEls[i], pr = project(cty.lat, cty.lon, LAND_H); el.style.left = pr.x+"px"; el.style.top = pr.y+"px"; el.style.opacity = (wide && pr.ok) ? .8 : 0; });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
let start = 0; try{ start = parseInt(localStorage.getItem("trip-ch")||"0",10) || 0 }catch(e){}
if(renderer){ resize(); show(start, true); requestAnimationFrame(frame); } else { show(start, true); }
})();
</script>
